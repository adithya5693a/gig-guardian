<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Shield shape -->
  <path d="M 256 74
           C 340 74 394 100 404 116
           C 404 250 366 364 256 438
           C 146 364 108 250 108 116
           C 118 100 172 74 256 74 Z"
        fill="url(#shieldGrad)"
        filter="url(#shadow)"/>

  <!-- Inner shield accent border -->
  <path d="M 256 94
           C 328 94 374 116 384 130
           C 384 242 352 342 256 412
           C 160 342 128 242 128 130
           C 138 116 184 94 256 94 Z"
        fill="none"
        stroke="#fef3c7"
        stroke-width="5"
        stroke-opacity="0.5"/>

  <!-- Bold modern "G" inside shield -->
  <path d="M 334 232
           L 256 232
           C 246 232 240 238 240 248
           L 240 264
           C 240 274 246 280 256 280
           L 294 280
           C 294 308 274 324 248 324
           C 206 324 182 292 182 254
           C 182 216 206 184 248 184
           C 272 184 290 196 298 210
           C 304 220 316 222 326 216
           L 342 204
           C 350 198 350 186 342 176
           C 320 148 288 134 248 134
           C 176 134 130 186 130 254
           C 130 322 176 374 248 374
           C 306 374 346 332 346 268
           L 346 244
           C 346 237 341 232 334 232 Z"
        fill="#0f172a"/>
</svg>
